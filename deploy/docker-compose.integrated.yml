name: licensehub

# Use when an existing reverse proxy already owns ports 80/443. The proxy must
# join EXTERNAL_EDGE_NETWORK and route the license domain to
# licensehub-server:9000. LicenseHub keeps PostgreSQL on the private data net.
services:
  server:
    build:
      context: ../server
      dockerfile: Dockerfile
      args:
        VERSION: ${LICENSEHUB_VERSION:-dev}
    environment:
      ENVIRONMENT: production
      BASE_URL: https://${LICENSE_DOMAIN}
      LICENSE_LEASE_TTL: ${LICENSE_LEASE_TTL:-72h}
    env_file: ${LICENSEHUB_ENV_FILE:-.env}
    depends_on:
      postgres:
        condition: service_healthy
    expose: ["9000"]
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    pids_limit: 200
    mem_limit: 768m
    cpus: 1.5
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      data: {}
      external-edge:
        aliases: [licensehub-server]

  postgres:
    image: postgres:18-alpine
    env_file: ${LICENSEHUB_ENV_FILE:-.env}
    volumes:
      - postgres-data:/var/lib/postgresql
    restart: unless-stopped
    init: true
    pids_limit: 200
    mem_limit: 1g
    cpus: 1.5
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-licensehub} -d ${POSTGRES_DB:-licensehub}"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks: [data]

volumes:
  postgres-data:

networks:
  data:
    internal: true
  external-edge:
    external: true
    name: ${EXTERNAL_EDGE_NETWORK:?set EXTERNAL_EDGE_NETWORK}
