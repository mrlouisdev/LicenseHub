name: licensehub

services:
  server:
    image: licensehub-server:${LICENSEHUB_VERSION:-dev}
    build:
      context: ../server
      dockerfile: Dockerfile
      args:
        VERSION: ${LICENSEHUB_VERSION:-dev}
        COMMIT: ${LICENSEHUB_COMMIT:-unknown}
        BUILD_DATE: ${LICENSEHUB_BUILD_DATE:-unknown}
        BUN_IMAGE: ${BUN_IMAGE:?set verified bun image digest}
        GOLANG_IMAGE: ${GOLANG_IMAGE:?set verified golang image digest}
        ALPINE_IMAGE: ${ALPINE_IMAGE:?set verified alpine image digest}
    environment:
      ENVIRONMENT: production
      BASE_URL: https://${LICENSE_DOMAIN}
      LICENSE_LEASE_TTL: ${LICENSE_LEASE_TTL:-72h}
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      DATABASE_URL_FILE: /run/secrets/database_url
      LICENSE_SIGNING_KEY_FILE: /run/secrets/license_signing_key
      LICENSE_SIGNING_KEY_ID: ${LICENSE_SIGNING_KEY_ID:-v1}
      LICENSE_RETAINED_PUBLIC_KEYS: ${LICENSE_RETAINED_PUBLIC_KEYS:-{}}
      RELEASE_KEY_ENCRYPTION_KEY_FILE: /run/secrets/release_key_encryption_key
      METRICS_TOKEN_FILE: /run/secrets/metrics_token
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD_FILE: /run/secrets/smtp_password
      SMTP_FROM: ${SMTP_FROM:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_LIVEMODE: ${STRIPE_LIVEMODE:-false}
      ADMIN_EMAILS: ${ADMIN_EMAILS:?set ADMIN_EMAILS}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-}
      STORAGE_REGION: ${STORAGE_REGION:-auto}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-}
      STORAGE_ACCESS_KEY_FILE: /run/secrets/storage_access_key
      STORAGE_SECRET_KEY_FILE: /run/secrets/storage_secret_key
      STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL:-}
      STORAGE_FORCE_PATH_STYLE: ${STORAGE_FORCE_PATH_STYLE:-false}
      STORAGE_UPLOAD_TTL: ${STORAGE_UPLOAD_TTL:-1h}
      STORAGE_DOWNLOAD_TTL: ${STORAGE_DOWNLOAD_TTL:-10m}
      MAX_RELEASE_SIGN_SIZE_MB: ${MAX_RELEASE_SIGN_SIZE_MB:-500}
      RATE_LIMIT_API: ${RATE_LIMIT_API:-60}
      RATE_LIMIT_ADMIN: ${RATE_LIMIT_ADMIN:-120}
      RATE_LIMIT_AUTH: ${RATE_LIMIT_AUTH:-20}
      BF_MAX_FAILS: ${BF_MAX_FAILS:-5}
      BF_LOCKOUT_SECONDS: ${BF_LOCKOUT_SECONDS:-30}
      WEBHOOK_MAX_ATTEMPTS: ${WEBHOOK_MAX_ATTEMPTS:-5}
      WEBHOOK_RETRY_INTERVAL: ${WEBHOOK_RETRY_INTERVAL:-30s}
      WEBHOOK_HTTP_TIMEOUT: ${WEBHOOK_HTTP_TIMEOUT:-10s}
      QUOTA_WARNING_THRESHOLD: ${QUOTA_WARNING_THRESHOLD:-0.8}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    secrets:
      - database_url
      - jwt_secret
      - license_signing_key
      - release_key_encryption_key
      - metrics_token
      - smtp_password
      - storage_access_key
      - storage_secret_key
    expose: ["9000"]
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    pids_limit: 200
    mem_limit: 768m
    cpus: 1.5
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks: [edge, data]

  postgres:
    image: ${POSTGRES_IMAGE:?set verified postgres image digest}
    user: "70:70"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-licensehub}
      POSTGRES_DB: ${POSTGRES_DB:-licensehub}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql
    restart: unless-stopped
    init: true
    pids_limit: 200
    mem_limit: 1g
    cpus: 1.5
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-licensehub} -d ${POSTGRES_DB:-licensehub}"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks: [data]

  redis:
    image: ${REDIS_IMAGE:?set verified redis image digest}
    user: "999:999"
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis-data:/data
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    pids_limit: 100
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks: [data]

  caddy:
    image: ${CADDY_IMAGE:?set verified caddy image digest}
    user: "1000:1000"
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
      LICENSE_DOMAIN: ${LICENSE_DOMAIN:?set LICENSE_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    pids_limit: 100
    mem_limit: 256m
    cpus: 0.5
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks: [edge]

volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:

networks:
  edge:
  data:
    internal: true

secrets:
  postgres_password:
    file: ${LICENSEHUB_SECRETS_DIR:?materialize deployment secrets}/postgres_password
  database_url:
    file: ${LICENSEHUB_SECRETS_DIR:?materialize deployment secrets}/database_url
  jwt_secret:
    file: ${LICENSEHUB_SECRETS_DIR:?materialize deployment secrets}/jwt_secret
  license_signing_key:
    file: ${LICENSEHUB_SECRETS_DIR:?materialize deployment secrets}/license_signing_key
  release_key_encryption_key:
    file: ${LICENSEHUB_SECRETS_DIR:?materialize deployment secrets}/release_key_encryption_key
  metrics_token:
    file: ${LICENSEHUB_SECRETS_DIR:?materialize deployment secrets}/metrics_token
  smtp_password:
    file: ${LICENSEHUB_SECRETS_DIR:?materialize deployment secrets}/smtp_password
  storage_access_key:
    file: ${LICENSEHUB_SECRETS_DIR:?materialize deployment secrets}/storage_access_key
  storage_secret_key:
    file: ${LICENSEHUB_SECRETS_DIR:?materialize deployment secrets}/storage_secret_key
