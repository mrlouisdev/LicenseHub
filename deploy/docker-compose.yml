name: licensehub

services:
  server:
    build:
      context: ../server
      dockerfile: Dockerfile
      args:
        VERSION: ${LICENSEHUB_VERSION:-dev}
    environment:
      ENVIRONMENT: production
      BASE_URL: https://${LICENSE_DOMAIN}
      LICENSE_LEASE_TTL: ${LICENSE_LEASE_TTL:-72h}
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    expose: ["9000"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt: ["no-new-privileges:true"]
    networks: [edge, data]

  postgres:
    image: postgres:18-alpine
    env_file: .env
    volumes:
      - postgres-data:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-licensehub} -d ${POSTGRES_DB:-licensehub}"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt: ["no-new-privileges:true"]
    networks: [data]

  caddy:
    image: caddy:2.10-alpine
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    networks: [edge]

volumes:
  postgres-data:
  caddy-data:
  caddy-config:

networks:
  edge:
  data:
    internal: true
